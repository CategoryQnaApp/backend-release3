name: Deploy to AWS EC2

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Application
        run: ./gradlew clean build

      - name: Upload Build Artifact
        run: |
          mkdir artifacts
          cp build/libs/*.jar artifacts/app.jar

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "[EC2] Stopping previous server..."
            pkill -f 'java -jar' || true

            echo "[EC2] Replacing jar..."
            rm -f ~/app/app.jar
            mkdir -p ~/app
            exit

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "artifacts/app.jar"
          target: "~/app/"

      - name: Start Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "[EC2] Starting new server..."
            nohup java -jar ~/app/app.jar > ~/app/app.log 2>&1 &
            echo "✅ Deployed Successfully!"
