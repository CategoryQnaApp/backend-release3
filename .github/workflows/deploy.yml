name: Deploy to AWS EC2

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 권한 부여
        run: chmod +x ./gradlew

      - name: Build Application
        run: ./gradlew clean build

      - name: Upload Build Artifact
        run: |
          cp build/libs/*.jar app.jar
      - name: Stop Previous Application on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "[EC2] Stopping previous server..."
            PID=$(pgrep -f 'java -Dspring.profiles.active=dev -jar /home/ubuntu/app/app.jar')
            if [ -n "$PID" ]; then
            echo "Killing PID: $PID"
            (sleep 1 && kill $PID) &
            else
            echo "No running app.jar process found."
            fi
            
            echo "[EC2] Preparing app directory..."
            mkdir -p ~/app
            rm -f ~/app/app.jar
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "app.jar"
          target: "~/app/"

      - name: Start Application on EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "[EC2] Starting new server..."
            nohup java -Dspring.profiles.active=dev -jar ~/app/app.jar > ~/app/app.log 2>&1 &
            echo "✅ Deployed Successfully!"
